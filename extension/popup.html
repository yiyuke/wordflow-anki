<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Wordflow to Anki</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1 data-i18n="popupTitle">Quick Add to Anki</h1>
          <p data-i18n="openWindow">Open window: ⌥⇧W</p>
        </div>
      </header>

      <label for="word" data-i18n="wordLabel">Word or phrase</label>
      <input id="word" autocomplete="off" placeholder="e.g. serendipity" data-i18n-placeholder="wordPlaceholder" autofocus />

      <label for="deck" data-i18n="deckLabel">Save to Anki deck</label>
      <select id="deck" disabled>
        <option data-i18n="loadingDecks">Loading decks…</option>
      </select>

      <label for="context" data-i18n="contextLabel">Example or context (optional)</label>
      <textarea id="context" rows="3" placeholder="Paste the sentence where you found it" data-i18n-placeholder="contextPlaceholder"></textarea>

      <button id="add" data-i18n="addButton">Generate and add to Anki</button>
      <p id="result" role="status"></p>
      <p class="hint" data-i18n="keyboardHint">↓/Tab move · ⌘D deck · ⌘↩ save &amp; return · Esc close</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
