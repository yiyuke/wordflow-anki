<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Wordflow to Anki</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>快速添加到 Anki</h1>
          <p>输入单词，可选填看到它的原句</p>
        </div>
      </header>

      <label for="word">单词或短语</label>
      <input id="word" autocomplete="off" placeholder="meticulous" autofocus />

      <label for="context">上下文（可选）</label>
      <textarea id="context" rows="3" placeholder="粘贴看到这个词的原句"></textarea>

      <button id="add">生成并加入 Anki</button>
      <p id="result" role="status"></p>
      <p class="hint">↓ / Tab 切换 · Enter 保存 · Esc 关闭</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
