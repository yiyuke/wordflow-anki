<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Wordflow to Anki</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>快速添加到 Anki</h1>
          <p>打开窗口：⌥⇧W</p>
        </div>
      </header>

      <label for="word">单词或短语</label>
      <input id="word" autocomplete="off" placeholder="meticulous" autofocus />

      <label for="deck">保存到 Anki 牌组</label>
      <select id="deck" disabled>
        <option>读取牌组…</option>
      </select>

      <label for="context">例句或上下文（可选）</label>
      <textarea id="context" rows="3" placeholder="粘贴看到这个词的原句"></textarea>

      <button id="add">生成并加入 Anki</button>
      <p id="result" role="status"></p>
      <p class="hint">↓/Tab 移动 · ⌘D 牌组 · ⌘↩ 保存切回 · Esc 关闭</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
