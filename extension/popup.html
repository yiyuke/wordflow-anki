<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Wordflow to Anki</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1 data-i18n="popupTitle">Quick Add to Anki</h1>
          <p data-i18n="openWindow">Open window: ⌥⇧W</p>
        </div>
        <div class="select-control select-control-compact" data-select="language">
          <input id="language" type="hidden" value="auto" />
          <button
            id="language-trigger"
            class="select-trigger"
            type="button"
            role="combobox"
            aria-haspopup="listbox"
            aria-expanded="false"
            aria-controls="language-listbox"
            aria-label="Language"
            data-i18n-aria-label="languageLabel"
          >
            <span class="select-value">Auto</span>
            <span class="select-chevron" aria-hidden="true"></span>
          </button>
          <div id="language-listbox" class="select-menu" role="listbox" hidden>
            <button class="select-option" type="button" role="option" data-value="auto" data-i18n="languageAuto">Auto</button>
            <button class="select-option" type="button" role="option" data-value="zh" data-i18n="languageChinese">中文</button>
            <button class="select-option" type="button" role="option" data-value="en" data-i18n="languageEnglish">English</button>
          </div>
        </div>
      </header>

      <label for="word" data-i18n="wordLabel">Word or phrase</label>
      <input id="word" autocomplete="off" placeholder="e.g. serendipity" data-i18n-placeholder="wordPlaceholder" autofocus />

      <label id="deck-label" for="deck-trigger" data-i18n="deckLabel">Save to Anki deck</label>
      <div class="select-control" data-select="deck">
        <input id="deck" type="hidden" value="" />
        <button
          id="deck-trigger"
          class="select-trigger"
          type="button"
          role="combobox"
          aria-haspopup="listbox"
          aria-expanded="false"
          aria-controls="deck-listbox"
          aria-labelledby="deck-label deck-value"
          disabled
          title="Lists your actual Anki decks and remembers the last choice"
          data-i18n-title="deckHelp"
        >
          <span id="deck-value" class="select-value" data-i18n="loadingDecks">Loading decks…</span>
          <span class="select-chevron" aria-hidden="true"></span>
        </button>
        <div id="deck-listbox" class="select-menu" role="listbox" hidden></div>
      </div>

      <label for="context" data-i18n="contextLabel">Example or context (optional)</label>
      <textarea id="context" rows="3" placeholder="Paste the sentence where you found it" data-i18n-placeholder="contextPlaceholder"></textarea>

      <button id="add" data-i18n="addButton">Generate and add to Anki</button>
      <p id="result" role="status"></p>
      <p class="hint" data-i18n="keyboardHint">↓/Tab move · ⌘D deck · ⌘↩ save &amp; return · Esc close</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
